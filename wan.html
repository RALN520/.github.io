<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工考勤系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; min-height: 100vh; }

/* 通用容器 */
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* 头部 */
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
.header h1 { font-size: 24px; margin-bottom: 8px; }

/* 搜索栏 */
.search-bar { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.search-bar input { flex: 1; padding: 12px 16px; border: 2px solid #e1e5eb; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
.search-bar input:focus { border-color: #667eea; }
.search-bar button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
.btn-search { background: #667eea; color: white; }
.btn-search:hover { background: #5a67d8; }

/* 统计卡片 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: white; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.stat-card .number { font-size: 28px; font-weight: bold; color: #667eea; }
.stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }

/* 日历 */
.calendar-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.calendar-header h3 { font-size: 18px; }
.calendar-header button { padding: 6px 14px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; }
.calendar-header button:hover { background: #f0f0f0; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-day-header { text-align: center; font-size: 13px; font-weight: 600; color: #666; padding: 8px 0; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: default; transition: transform 0.2s; border: 2px solid transparent; }
.cal-day:hover { transform: scale(1.05); }
.cal-day.empty { visibility: hidden; }
.cal-day.work { background: #d4edda; border-color: #28a745; color: #155724; }
.cal-day.leave { background: #fff3cd; border-color: #ffc107; color: #856404; }
.cal-day.overtime { background: #e2d4f0; border-color: #764ba2; color: #4a2c6d; }
.cal-day .day-num { font-weight: bold; font-size: 15px; }
.cal-day .day-tag { font-size: 10px; margin-top: 2px; }

/* 图例 */
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
.legend-dot { width: 14px; height: 14px; border-radius: 4px; }

/* 明细表 */
.detail-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.detail-section h3 { margin-bottom: 12px; }
.detail-table { width: 100%; border-collapse: collapse; }
.detail-table th { background: #f8f9fa; padding: 10px 8px; text-align: left; font-size: 13px; color: #555; border-bottom: 2px solid #dee2e6; }
.detail-table td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
.detail-table tr:hover td { background: #f8f9ff; }

/* 状态标签 */
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.tag-work { background: #d4edda; color: #155724; }
.tag-leave { background: #fff3cd; color: #856404; }
.tag-overtime { background: #e2d4f0; color: #4a2c6d; }

/* 底部 */
.footer { text-align: center; padding: 20px; }
.footer a { color: #667eea; text-decoration: none; font-size: 14px; }
.footer a:hover { text-decoration: underline; }

/* 管理员登录 */
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.login-box { background: white; padding: 32px; border-radius: 16px; width: 90%; max-width: 360px; text-align: center; }
.login-box h2 { margin-bottom: 20px; }
.login-box input { width: 100%; padding: 12px 16px; border: 2px solid #e1e5eb; border-radius: 8px; font-size: 16px; margin-bottom: 16px; outline: none; }
.login-box input:focus { border-color: #667eea; }
.login-box button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.login-box button:hover { background: #5a67d8; }
.login-box .error { color: #e74c3c; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
.login-box .back-link { margin-top: 12px; font-size: 14px; color: #888; cursor: pointer; display: inline-block; }
.login-box .back-link:hover { color: #667eea; }

/* 管理员后台 */
.admin-panel { max-width: 1000px; margin: 0 auto; padding: 20px; }
.admin-header { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); color: white; padding: 20px 24px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.admin-header h1 { font-size: 22px; }
.admin-header button { padding: 8px 16px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; }
.admin-header button:hover { background: rgba(255,255,255,0.3); }

.admin-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.admin-toolbar input, .admin-toolbar select { padding: 10px 14px; border: 2px solid #e1e5eb; border-radius: 8px; font-size: 14px; outline: none; }
.admin-toolbar input { flex: 1; min-width: 150px; }
.admin-toolbar button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn-add { background: #28a745; color: white; }
.btn-export { background: #17a2b8; color: white; }
.btn-import { background: #6c757d; color: white; }
.btn-clear { background: #dc3545; color: white; }

.admin-table-wrap { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
.admin-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.admin-table th { background: #f8f9fa; padding: 12px 10px; text-align: left; font-size: 13px; color: #555; border-bottom: 2px solid #dee2e6; }
.admin-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
.admin-table input, .admin-table select { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
.btn-delete { padding: 4px 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-delete:hover { background: #c82333; }

/* 新增弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1001; }
.modal-box { background: white; padding: 28px; border-radius: 16px; width: 90%; max-width: 420px; }
.modal-box h3 { margin-bottom: 20px; }
.modal-box label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 12px; }
.modal-box input, .modal-box select { width: 100%; padding: 10px 14px; border: 2px solid #e1e5eb; border-radius: 8px; font-size: 14px; outline: none; }
.modal-box input:focus, .modal-box select:focus { border-color: #667eea; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
.btn-save { background: #667eea; color: white; }
.btn-save:hover { background: #5a67d8; }
.btn-cancel { background: #e9ecef; color: #333; }
.btn-cancel:hover { background: #dee2e6; }

/* 隐藏 */
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- 员工查询页 -->
<div id="employeePage">
  <div class="container">
    <div class="header">
      <h1>📅 员工考勤查询</h1>
      <p>输入姓名，查看当月出勤情况</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchName" placeholder="请输入员工姓名..." />
      <button class="btn-search" onclick="searchEmployee()">查询</button>
    </div>

    <div id="resultArea" class="hidden">
      <div class="stats" id="statsArea"></div>
      <div class="calendar-section">
        <div class="calendar-header">
          <button onclick="prevMonth()">‹ 上月</button>
          <h3 id="calendarTitle"></h3>
          <button onclick="nextMonth()">下月 ›</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#d4edda;border:1px solid #28a745"></div>上班</div>
          <div class="legend-item"><div class="legend-dot" style="background:#fff3cd;border:1px solid #ffc107"></div>请假</div>
          <div class="legend-item"><div class="legend-dot" style="background:#e2d4f0;border:1px solid #764ba2"></div>加班</div>
        </div>
      </div>
      <div class="detail-section">
        <h3>📋 明细记录</h3>
        <table class="detail-table">
          <thead><tr><th>日期</th><th>状态</th><th>加班时长</th><th>备注</th></tr></thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>

    <div class="footer">
      <a href="#" onclick="showLogin();return false;">🔐 管理员入口</a>
    </div>
  </div>
</div>

<!-- 管理员登录 -->
<div id="loginPage" class="login-overlay hidden">
  <div class="login-box">
    <h2>🔐 管理员登录</h2>
    <div class="error" id="loginError"></div>
    <input type="password" id="adminPassword" placeholder="请输入管理员密码" />
    <button onclick="doLogin()">登 录</button>
    <br><span class="back-link" onclick="hideLogin()">← 返回查询页</span>
  </div>
</div>

<!-- 管理员后台 -->
<div id="adminPage" class="hidden">
  <div class="admin-panel">
    <div class="admin-header">
      <h1>🛠 管理员后台</h1>
      <button onclick="logout()">退出登录</button>
    </div>

    <div class="admin-toolbar">
      <input type="text" id="filterName" placeholder="搜索员工姓名..." oninput="renderAdminTable()" />
      <select id="filterStatus" onchange="renderAdminTable()">
        <option value="">全部状态</option>
        <option value="上班">上班</option>
        <option value="请假">请假</option>
        <option value="加班">加班</option>
      </select>
      <button class="btn-add" onclick="showAddModal()">＋ 新增记录</button>
      <button class="btn-export" onclick="exportData()">📤 导出</button>
      <button class="btn-import" onclick="importData()">📥 导入</button>
      <button class="btn-clear" onclick="clearAll()">⚠️ 清空</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>员工姓名</th><th>日期</th><th>状态</th><th>加班时长</th><th>备注</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="adminBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 新增记录弹窗 -->
<div id="addModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>＋ 新增考勤记录</h3>
    <label>员工姓名</label>
    <input type="text" id="addName" placeholder="姓名" />
    <label>日期</label>
    <input type="date" id="addDate" />
    <label>状态</label>
    <select id="addStatus" onchange="toggleOtField()">
      <option value="上班">上班</option>
      <option value="请假">请假</option>
      <option value="加班">加班</option>
    </select>
    <div id="otField">
      <label>加班时长（小时）</label>
      <input type="number" id="addOtHours" placeholder="如：2.5" step="0.5" min="0" />
    </div>
    <label>备注</label>
    <input type="text" id="addNote" placeholder="可选" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideAddModal()">取消</button>
      <button class="btn-save" onclick="saveAddRecord()">保存</button>
    </div>
  </div>
</div>

<script>
// ============ 数据层 ============
function getRecords() {
  return JSON.parse(localStorage.getItem('attendance_records') || '[]');
}
function saveRecords(records) {
  localStorage.setItem('attendance_records', JSON.stringify(records));
}

// ============ 员工查询 ============
let currentYear, currentMonth;
function searchEmployee() {
  var name = document.getElementById('searchName').value.trim();
  if (!name) { alert('请输入姓名'); return; }
  var records = getRecords().filter(function(r) { return r.name === name; });
  if (records.length === 0) { alert('未找到该员工的记录'); return; }

  document.getElementById('resultArea').classList.remove('hidden');

  // 统计
  var workDays = records.filter(function(r) { return r.status === '上班'; }).length;
  var leaveDays = records.filter(function(r) { return r.status === '请假'; }).length;
  var otHours = records.filter(function(r) { return r.status === '加班'; }).reduce(function(s, r) { return s + (parseFloat(r.otHours) || 0); }, 0);
  document.getElementById('statsArea').innerHTML =
    '<div class="stat-card"><div class="number">' + workDays + '</div><div class="label">上班天数</div></div>' +
    '<div class="stat-card"><div class="number">' + leaveDays + '</div><div class="label">请假天数</div></div>' +
    '<div class="stat-card"><div class="number">' + otHours.toFixed(1) + 'h</div><div class="label">加班时长</div></div>' +
    '<div class="stat-card"><div class="number">' + records.length + '</div><div class="label">总记录</div></div>';

  // 日历
  var today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  renderCalendar(records);

  // 明细
  records.sort(function(a, b) { return b.date.localeCompare(a.date); });
  var html = '';
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var tagClass = r.status === '上班' ? 'tag-work' : (r.status === '请假' ? 'tag-leave' : 'tag-overtime');
    html += '<tr><td>' + r.date + '</td><td><span class="tag ' + tagClass + '">' + r.status + '</span></td><td>' + (r.otHours || '-') + '</td><td>' + (r.note || '-') + '</td></tr>';
  }
  document.getElementById('detailBody').innerHTML = html;
}

function renderCalendar(records) {
  var title = currentYear + '年' + (currentMonth + 1) + '月';
  document.getElementById('calendarTitle').textContent = title;
  var grid = document.getElementById('calendarGrid');
  grid.innerHTML = '<div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';

  var firstDay = new Date(currentYear, currentMonth, 1).getDay();
  var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (var i = 0; i < firstDay; i++) {
    grid.innerHTML += '<div class="cal-day empty"></div>';
  }

  var recMap = {};
  for (var j = 0; j < records.length; j++) {
    var d = records[j].date;
    if (d.indexOf(currentYear + '-' + String(currentMonth + 1).padStart(2, '0')) === 0) {
      recMap[parseInt(d.split('-')[2])] = records[j];
    }
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var cls = 'cal-day';
    var tag = '';
    var rec = recMap[d];
    if (rec) {
      if (rec.status === '上班') { cls += ' work'; tag = '上班'; }
      else if (rec.status === '请假') { cls += ' leave'; tag = '请假'; }
      else if (rec.status === '加班') { cls += ' overtime'; tag = '加班' + (rec.otHours ? ' ' + rec.otHours + 'h' : ''); }
    }
    grid.innerHTML += '<div class="' + cls + '"><span class="day-num">' + d + '</span><span class="day-tag">' + tag + '</span></div>';
  }
}

function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } searchEmployee(); }
function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } searchEmployee(); }

// ============ 管理员登录 ============
function showLogin() { document.getElementById('loginPage').classList.remove('hidden'); document.getElementById('adminPassword').value = ''; document.getElementById('loginError').textContent = ''; }
function hideLogin() { document.getElementById('loginPage').classList.add('hidden'); }
function doLogin() {
  var pwd = document.getElementById('adminPassword').value;
  if (pwd === 'mid0707') {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('employeePage').classList.add('hidden');
    document.getElementById('adminPage').classList.remove('hidden');
    renderAdminTable();
  } else {
    document.getElementById('loginError').textContent = '密码错误，请重试';
  }
}
function logout() {
  document.getElementById('adminPage').classList.add('hidden');
  document.getElementById('employeePage').classList.remove('hidden');
}

// ============ 管理员表格 ============
function renderAdminTable() {
  var filterName = (document.getElementById('filterName').value || '').trim().toLowerCase();
  var filterStatus = document.getElementById('filterStatus').value;
  var records = getRecords();

  if (filterName) records = records.filter(function(r) { return r.name.toLowerCase().indexOf(filterName) !== -1; });
  if (filterStatus) records = records.filter(function(r) { return r.status === filterStatus; });

  records.sort(function(a, b) { return b.date.localeCompare(a.date); });

  var html = '';
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    html += '<tr>' +
      '<td><input value="' + escHtml(r.name) + '" onchange="updateRecord(' + i + ',\'name\',this.value)"></td>' +
      '<td><input type="date" value="' + r.date + '" onchange="updateRecord(' + i + ',\'date\',this.value)"></td>' +
      '<td><select onchange="updateRecord(' + i + ',\'status\',this.value)">' +
        '<option value="上班"' + (r.status === '上班' ? ' selected' : '') + '>上班</option>' +
        '<option value="请假"' + (r.status === '请假' ? ' selected' : '') + '>请假</option>' +
        '<option value="加班"' + (r.status === '加班' ? ' selected' : '') + '>加班</option>' +
      '</select></td>' +
      '<td><input type="number" step="0.5" min="0" value="' + (r.otHours || '') + '" placeholder="-" onchange="updateRecord(' + i + ',\'otHours\',this.value)"></td>' +
      '<td><input value="' + escHtml(r.note || '') + '" onchange="updateRecord(' + i + ',\'note\',this.value)"></td>' +
      '<td><button class="btn-delete" onclick="deleteRecord(' + i + ')">删除</button></td>' +
    '</tr>';
  }
  document.getElementById('adminBody').innerHTML = html;
}

function updateRecord(index, field, value) {
  var records = getRecords();
  // 注意：filter后index对应的是过滤后的位置，需要重新找到原始记录
  // 简化处理：直接用日期+姓名作为key不太靠谱，这里改用全局index
  // 实际上filter后index变了，需要重新获取原始数据
  // 重新实现：render时把原始index存data-index
  // 暂时用简单方案：直接保存全部
  saveRecords(records);
  renderAdminTable();
}

// 修正：用data-index存原始索引
// 重新写renderAdminTable，存原始index
function renderAdminTable() {
  var filterName = (document.getElementById('filterName').value || '').trim().toLowerCase();
  var filterStatus = document.getElementById('filterStatus').value;
  var allRecords = getRecords();

  var filtered = allRecords.map(function(r, idx) { return { record: r, origIndex: idx }; });
  if (filterName) filtered = filtered.filter(function(item) { return item.record.name.toLowerCase().indexOf(filterName) !== -1; });
  if (filterStatus) filtered = filtered.filter(function(item) { return item.record.status === filterStatus; });

  filtered.sort(function(a, b) { return b.record.date.localeCompare(a.record.date); });

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var item = filtered[i];
    var r = item.record;
    var oi = item.origIndex;
    html += '<tr>' +
      '<td><input value="' + escHtml(r.name) + '" onchange="updateRecord(' + oi + ',\'name\',this.value)"></td>' +
      '<td><input type="date" value="' + r.date + '" onchange="updateRecord(' + oi + ',\'date\',this.value)"></td>' +
      '<td><select onchange="updateRecord(' + oi + ',\'status\',this.value)">' +
        '<option value="上班"' + (r.status === '上班' ? ' selected' : '') + '>上班</option>' +
        '<option value="请假"' + (r.status === '请假' ? ' selected' : '') + '>请假</option>' +
        '<option value="加班"' + (r.status === '加班' ? ' selected' : '') + '>加班</option>' +
      '</select></td>' +
      '<td><input type="number" step="0.5" min="0" value="' + (r.otHours || '') + '" placeholder="-" onchange="updateRecord(' + oi + ',\'otHours\',this.value)"></td>' +
      '<td><input value="' + escHtml(r.note || '') + '" onchange="updateRecord(' + oi + ',\'note\',this.value)"></td>' +
      '<td><button class="btn-delete" onclick="deleteRecord(' + oi + ')">删除</button></td>' +
    '</tr>';
  }
  document.getElementById('adminBody').innerHTML = html;
}

function deleteRecord(origIndex) {
  if (!confirm('确定删除这条记录？')) return;
  var records = getRecords();
  records.splice(origIndex, 1);
  saveRecords(records);
  renderAdminTable();
}

// ============ 新增记录 ============
function showAddModal() {
  document.getElementById('addModal').classList.remove('hidden');
  document.getElementById('addName').value = '';
  document.getElementById('addDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('addStatus').value = '上班';
  document.getElementById('addOtHours').value = '';
  document.getElementById('addNote').value = '';
  document.getElementById('otField').style.display = 'none';
}
function hideAddModal() {
  document.getElementById('addModal').classList.add('hidden');
}
function toggleOtField() {
  var status = document.getElementById('addStatus').value;
  document.getElementById('otField').style.display = (status === '加班') ? 'block' : 'none';
}
function saveAddRecord() {
  var name = document.getElementById('addName').value.trim();
  var date = document.getElementById('addDate').value;
  var status = document.getElementById('addStatus').value;
  var otHours = document.getElementById('addOtHours').value;
  var note = document.getElementById('addNote').value.trim();

  if (!name || !date) { alert('请填写姓名和日期'); return; }
  if (status === '加班' && (!otHours || parseFloat(otHours) <= 0)) { alert('加班状态请填写加班时长'); return; }

  var records = getRecords();
  records.push({
    name: name,
    date: date,
    status: status,
    otHours: status === '加班' ? parseFloat(otHours) : null,
    note: note
  });
  saveRecords(records);
  hideAddModal();
  renderAdminTable();
  alert('添加成功！');
}

// ============ 工具 ============
function exportData() {
  var data = JSON.stringify(getRecords(), null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'attendance_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('格式错误');
        if (confirm('导入将覆盖现有数据，确定？')) {
          saveRecords(data);
          renderAdminTable();
          alert('导入成功！');
        }
      } catch (err) { alert('文件格式错误'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAll() {
  if (confirm('⚠️ 确定清空所有考勤数据？此操作不可恢复！')) {
    localStorage.removeItem('attendance_records');
    renderAdminTable();
    alert('已清空');
  }
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 回车查询
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('searchName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchEmployee();
  });
  document.getElementById('adminPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
});
</script>
